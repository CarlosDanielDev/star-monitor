name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # ponytail: version-pinned, not lockfile-hashed; add a package-lock when the
      # threat model grows beyond owner-only PRs with a read-only token
      - run: npx --yes markdownlint-cli2@0.23.3
